[project]
name = "wa-platform"
version = "0.1.0"
description = "Multi-tenant WhatsApp AI chatbot platform backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "mangum>=0.19",
  "pydantic[email]>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "httpx>=0.27",
  "boto3>=1.35",
  "argon2-cffi>=23.1",
  "structlog>=24.4",
  "cryptography>=43.0",
]

[project.optional-dependencies]
dev = [
  "uvicorn[standard]>=0.30",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "moto[sqs,kms,secretsmanager]>=5.0",
  "ruff>=0.7",
  "mypy>=1.13",
  "httpx>=0.27",
  "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wa_platform"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends(...) default-argument pattern is the documented idiom, not a bug.
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
packages = ["wa_platform"]
mypy_path = "src"
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
# tests/live hits the real Meta Graph API and needs live sandbox credentials — excluded from
# the default run (and therefore from CI). Run it explicitly with `make test-live`.
testpaths = ["tests/unit", "tests/integration"]
markers = [
  "live: hits the real Meta Graph API; requires META_TEST_* env vars, run via `make test-live`",
]
